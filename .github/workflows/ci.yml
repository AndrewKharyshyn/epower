name: ci
on:
  pull_request:
  push:
    branches: [main, master, "claude/**"]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements.pinned.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: pip install -r requirements.pinned.txt
      - run: npm ci --no-audit --no-fund
      - name: Compile all Python
        run: python -m compileall -q *.py tools
      - name: Import integrity (files present, raw names/rows, master MD5)
        run: python tools/verify_import.py --quick --expect-master-md5 0bcfc400d8ce2a0b15cdc7f3ddd8efff
        env: {XT_RAW_DIR: raw}
      - name: Unit tests
        run: |
          for t in test_seasonal_adjust test_seasonal test_assumptions_registry test_track4 test_cohort_rates test_post_step_idempotent; do python $t.py; done
          python tests/synthetic/test_estimator_gate.py
  release-gate:
    # Authoritative gate (blocking).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements.pinned.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: pip install -r requirements.pinned.txt
      - run: npm ci --no-audit --no-fund
      - run: python release_check.py
        env: {XT_RAW_DIR: raw}
