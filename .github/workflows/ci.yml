name: ci
# M368 (Actions-minutes budget): pull_request + manual dispatch only, one run per ref at a time (a newer push cancels the older run).
# M562 (2026-11-02, repository public, minutes no longer critical): the former single job (about 25 min) is split into parallel jobs python-tests, js-tests and
# release-check (M563: python-tests is a 3-shard matrix); the job named release-gate is a cheap aggregator that needs all three (the merge rule names it). Run it manually from the Actions tab when a
# branch has no PR yet (workflow_dispatch).
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {shard: [0, 1, 2]}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements.pinned.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: pip install -r requirements.pinned.txt
      - run: npm ci --no-audit --no-fund
      - name: Compile all Python
        run: python -m compileall -q *.py tools
      - name: Import integrity (files present, raw names/rows, master MD5)
        run: python tools/verify_import.py --quick --expect-master-md5 77bbe275f8c22eaf62d8636867764af3
        env: {XT_RAW_DIR: raw}
      - name: Unit tests (python, shard ${{ matrix.shard }} of 3)
        run: |
          # M563: the list is split round-robin by line over 3 parallel shards; add a new test as one line in the list, nothing else to change.
