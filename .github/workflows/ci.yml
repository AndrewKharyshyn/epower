  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements.pinned.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: pip install -r requirements.pinned.txt
      - run: npm ci --no-audit --no-fund
      - name: Release gate
        run: python release_check.py
  release-gate:
    # Aggregator with the name the merge rule requires: green only if the three parallel jobs are green.
    needs: [python-tests, js-tests, release-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All parallel jobs succeeded
        run: |
          echo "python-tests=${{ needs.python-tests.result }} js-tests=${{ needs.js-tests.result }} release-check=${{ needs.release-check.result }}"
          test "${{ needs.python-tests.result }}" = success && test "${{ needs.js-tests.result }}" = success && test "${{ needs.release-check.result }}" = success
