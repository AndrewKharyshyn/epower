name: ci
# M368 (Actions-minutes budget): pull_request + manual dispatch only (a PR run already validates the branch head; the previous push triggers on claude/** and main
# re-ran the same code, ~70 % of the minutes), one run per ref at a time (a newer push cancels the older run), and ONE job (the repository is ~1 GB, so every extra job
# costs a full checkout; the cheap unit tests run first so a failure stops the job early, then the authoritative gate). Run it manually from the Actions tab when a
# branch has no PR yet (workflow_dispatch).
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-gate:
    # Authoritative gate (blocking): fast unit tests first, then release_check.py.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements.pinned.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: pip install -r requirements.pinned.txt
      - run: npm ci --no-audit --no-fund
      - name: Compile all Python
        run: python -m compileall -q *.py tools
      - name: Import integrity (files present, raw names/rows, master MD5)
        run: python tools/verify_import.py --quick --expect-master-md5 5556a0c6c8bcde0f6c64b8b9655208ed
        env: {XT_RAW_DIR: raw}
      - name: Unit tests
        run: |
          for t in test_seasonal_adjust test_seasonal test_assumptions_registry test_track4 test_cohort_rates test_post_step_idempotent; do python $t.py; done
          python tests/synthetic/test_estimator_gate.py
